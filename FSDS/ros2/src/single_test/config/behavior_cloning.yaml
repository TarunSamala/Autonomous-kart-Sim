schema_version: 1

test:
  id: hp60c_behavior_cloning_benchmark
  track: TrainingMap
  max_duration_s: 60.0
  operation: autonomy

sensors:
  lidar: off
  depth_camera: hp60c
  chassis_imu: true

algorithms:
  odometry: none
  slam: none
  planner: behavior_cloning
  controller: behavior_cloning
  filter: none

research:
  family: behavior_cloning
  protocol: held_out_closed_loop_lap
  reference: "End to End Learning for Self-Driving Cars"
  hypothesis: "A run-level held-out RGB-D policy can complete one cone-free lap within the time limit."
  independent_variables: [input_modality, training_runs, model_checkpoint, maximum_throttle]
  dependent_metrics: [completion, lap_time_s, cone_contacts, distance_m, intervention_count]
  random_seed: 0
  uses_privileged_simulation_data: false

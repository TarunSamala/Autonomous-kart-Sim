schema_version: 1

test:
  id: fsds16_d455_delaunay_phase1
  track: TrainingMap
  max_duration_s: 180.0
  operation: autonomy

sensors:
  # Use the dense development LiDAR for the first functional baseline. Named
  # hardware profiles can be benchmarked after the pipeline completes a lap.
  lidar: fsds_16
  depth_camera: d455
  chassis_imu: true

algorithms:
  odometry: gss
  slam: none
  planner: delaunay_beam_search
  controller: pure_pursuit
  filter: none

research:
  family: amz_style
  protocol: closed_loop_lap
  reference: "AMZ Driverless: The Full Autonomous Racing System"
  hypothesis: "LiDAR cone extraction and local Delaunay planning can complete one cone-free lap without a prior map."
  independent_variables: [lidar_profile, target_speed, lookahead_distance]
  dependent_metrics: [completion, lap_time_s, cone_contacts, distance_m, average_speed_mps, maximum_speed_mps]
  random_seed: 0
  uses_privileged_simulation_data: false

schema_version: 1

test:
  id: a3m1_d455_slam_toolbox_trackdrive
  track: TrainingMap
  max_duration_s: 900.0
  operation: autonomy

sensors:
  lidar: a3m1
  depth_camera: d455
  chassis_imu: true

algorithms:
  odometry: sensor_odometry
  slam: slam_toolbox_localization
  planner: recorded_route
  controller: pure_pursuit
  filter: none

artifacts:
  map: generated/maps/TrainingMap/track_sensor
  route: generated/maps/TrainingMap/route_sensor_slam.json

research:
  family: slam
  protocol: map_localize_drive
  reference: "SLAM Toolbox: SLAM for the dynamic world"
  hypothesis: "A saved pose graph and sensor-derived route can localize and complete one cone-free lap."
  independent_variables: [lidar_profile, localization_backend, target_speed]
  dependent_metrics: [completion, lap_time_s, cone_contacts, distance_m, localization_failures]
  random_seed: 0
  uses_privileged_simulation_data: false

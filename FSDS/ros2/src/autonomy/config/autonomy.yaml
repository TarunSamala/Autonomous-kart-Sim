cone_detector:
  ros__parameters:
    lidar_topic: /fsds/lidar/Lidar1
    base_frame: fsds/FSCar
    cluster_radius: 0.25
    min_cluster_points: 3
    max_cluster_points: 180
    min_range: 0.5
    max_range: 15.0
    min_z: -0.50
    max_z: 0.10
    max_cluster_extent: 0.65

local_planner:
  ros__parameters:
    base_frame: fsds/FSCar
    use_delaunay: true
    min_track_width: 1.5
    max_track_width: 6.0
    max_longitudinal_offset: 2.0
    # Used only when one boundary temporarily has too few visible cones.
    half_track_width: 2.0
    input_timeout: 0.5
    sensor_horizon: 12.0
    minimum_forward_x: 0.1
    maximum_segment_length: 6.0
    beam_width: 64
    maximum_depth: 14
    maximum_debug_paths: 40
    heading_weight: 5.0
    width_weight: 1.5
    spacing_weight: 0.8
    horizon_weight: 2.0
    start_weight: 1.0
    color_order_weight: 8.0

track_reference_planner:
  ros__parameters:
    track_topic: /fsds/testing_only/track
    pose_topic: /fsds/testing_only/odom
    base_frame: fsds/FSCar
    global_frame: fsds/map
    path_spacing: 0.40
    path_horizon: 24.0
    max_path_deviation: 3.0
    # Averaging a closed polyline pulls tight bends toward the inside cones.
    # Keep the paired boundary midpoint polyline unsmoothed for clearance.
    smoothing_passes: 0

pure_pursuit:
  ros__parameters:
    enabled: false
    require_go: true
    lookahead_distance: 1.5
    wheelbase: 1.55
    max_steering_angle: 0.436332
    target_speed: 1.00
    corner_speed: 0.70
    max_speed: 1.40
    full_corner_curvature: 0.35
    speed_kp: 0.20
    speed_ki: 0.03
    speed_integral_limit: 1.0
    max_tracking_throttle: 0.16
    max_tracking_brake: 0.70
    overspeed_brake: 1.00
    launch_throttle: 0.55
    launch_release_speed: 0.10
    launch_pulse_duration: 0.10
    launch_timeout: 0.75
    path_timeout: 0.5
    speed_timeout: 0.5
    go_timeout: 4.0
    stop_on_cone_contact: true
    stop_after_laps: 1
    # FSDS reports the initial departure through its start-line trigger as a
    # lap. Ignore that event; TrainingMap is far longer than this threshold.
    minimum_lap_distance_m: 100.0
    extra_info_timeout: 2.0
